<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments :: head('登录')}"></head>
<body>
<div class="login-wrap">
    <form class="login-card" th:action="@{/login}" method="post">
        <h1>同意管理平台</h1>
        <div class="sub">按用途存证的同意与撤回管理后台</div>
        <div class="login-error" th:if="${param.error}">用户名或密码不正确</div>
        <div class="flash ok" th:if="${param.logout}" style="background:var(--ok-soft);color:var(--ok);padding:8px 12px;border-radius:7px;font-size:12.5px;margin-bottom:12px;">已安全退出</div>
        <label class="field">
            <span>用户名</span>
            <input type="text" name="username" autocomplete="username" autofocus required>
        </label>
        <label class="field">
            <span>密码</span>
            <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button class="btn primary" type="submit">登录</button>
        <p class="muted" style="font-size:11.5px;margin-top:18px;line-height:1.6;">
            演示环境默认账号 <code>admin</code> / <code>admin123!</code>，
            生产部署请通过环境变量 <code>CONSENT_ADMIN_PASSWORD</code> 覆盖。
        </p>
    </form>
</div>
</body>
</html>
